name: Randomized Package Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # every hour

jobs:
  randomized-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push changes back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide Random Execution
        id: random_check
        run: |
          NUMBER=$((RANDOM % 100))
          echo "Random number: $NUMBER"

          # 50% chance to continue
          if [ "$NUMBER" -lt 50 ]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          else
            echo "run_job=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip Run
        if: steps.random_check.outputs.run_job == 'false'
        run: echo "Skipping this cycle"

      - name: Random Delay
        if: steps.random_check.outputs.run_job == 'true'
        run: |
          DELAY=$((RANDOM % 300))
          echo "Sleeping for $DELAY seconds"
          sleep $DELAY

      - name: Create Temp Project
        if: steps.random_check.outputs.run_job == 'true'
        run: |
          mkdir test-app
          cd test-app
          npm init -y

      - name: Randomized Install Count
        if: steps.random_check.outputs.run_job == 'true'
        run: |
          cd test-app
          COUNT=$(( (RANDOM % 3) + 1 ))
          echo "Running $COUNT install tests"

          for i in $(seq 1 $COUNT)
          do
            echo "Test run $i"
            rm -rf node_modules package-lock.json
            npm install create-server-startup
          done

      - name: Keep-Alive Commit
        if: steps.random_check.outputs.run_job == 'true'
        run: |
          # Create or update a keep-alive file with the current timestamp
          echo "Last active run: $(date -u)" > keep-alive.txt

          # Configure Git using the standard GitHub Actions bot credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage, commit, and push the change
          git add keep-alive.txt
          git diff-index --quiet HEAD || git commit -m "chore: automated keep-alive update [skip ci]"
          git push
